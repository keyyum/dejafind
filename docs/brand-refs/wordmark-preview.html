<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600&display=swap" rel="stylesheet">
<style>
  body { background:#fcfcfa; margin:0; padding:40px; }
  svg text { font-family: 'Figtree', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
</style>
</head>
<body>
<svg id="horiz" width="320" height="80" viewBox="0 0 320 80" style="outline:1px solid #ededea;">
  <g transform="translate(4,20) scale(0.625)">
    <path fill-rule="evenodd" clip-rule="evenodd" fill="#1f1f1d" d="M18 8L36 8L44 22L50 14L50 52A4 4 0 0 1 46 56L18 56A4 4 0 0 1 14 52L14 12A4 4 0 0 1 18 8Z M23.5 36H40.5A2.5 2.5 0 0 1 43 38.5A2.5 2.5 0 0 1 40.5 41H23.5A2.5 2.5 0 0 1 21 38.5A2.5 2.5 0 0 1 23.5 36Z"/>
  </g>
  <text id="wordtext" x="56" y="50" font-size="34" fill="#1f1f1d">Déjà<tspan fill="#7a7a74">Find</tspan></text>
</svg>
<pre id="out" style="font-family:monospace;font-size:14px;"></pre>
<script>
  document.fonts.ready.then(() => {
    const t = document.getElementById('wordtext');
    const bbox = t.getBBox();
    document.getElementById('out').textContent = `x=${bbox.x} y=${bbox.y} w=${bbox.width} h=${bbox.height}`;
    const svg = document.getElementById('horiz');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', bbox.x); rect.setAttribute('y', bbox.y);
    rect.setAttribute('width', bbox.width); rect.setAttribute('height', bbox.height);
    rect.setAttribute('fill','none'); rect.setAttribute('stroke','red');
    svg.appendChild(rect);
  });
</script>
</body>
</html>
