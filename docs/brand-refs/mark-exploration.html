<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#fcfcfa; margin:0; padding:40px; font-family: sans-serif; }
  .row { display:flex; gap:40px; align-items:flex-end; margin-bottom:48px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .big svg { width:160px; height:160px; }
  .mid svg { width:64px; height:64px; }
  .small svg { width:32px; height:32px; }
  .tiny svg { width:16px; height:16px; }
  label { font-size:12px; color:#7a7a74; }
  .tile { background:#fff; border:1px solid #ededea; border-radius:8px; padding:12px; }
</style>
</head>
<body>

<!-- V1: classic dog-ear, flap as solid triangle, bold line mid -->
<div class="row">
<div class="cell big tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H38L50 20V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" d="M38 8L50 20H41C39.3 20 38 18.7 38 17V8Z"/>
  <rect x="21" y="36" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell mid tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H38L50 20V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" d="M38 8L50 20H41C39.3 20 38 18.7 38 17V8Z"/>
  <rect x="21" y="36" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell small tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H38L50 20V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" d="M38 8L50 20H41C39.3 20 38 18.7 38 17V8Z"/>
  <rect x="21" y="36" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell tiny tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H38L50 20V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" d="M38 8L50 20H41C39.3 20 38 18.7 38 17V8Z"/>
  <rect x="21" y="36" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<label>V1 — flap knockout, bold line</label>
</div>

<!-- V2: L-shaped silhouette (corner truly cut), small inset flap triangle landed on page -->
<div class="row">
<div class="cell big tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H39L50 19V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#1f1f1d" d="M39 19H30C28.3 19 27 20.3 27 22V31L39 19Z" opacity="0"/>
  <path fill="#1f1f1d" d="M30 23L41 23L41 34Z" transform="translate(0,0)"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell mid tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H39L50 19V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#1f1f1d" d="M30 23L41 23L41 34Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell small tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H39L50 19V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#1f1f1d" d="M30 23L41 23L41 34Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell tiny tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H39L50 19V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#1f1f1d" d="M30 23L41 23L41 34Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<label>V2 — cut corner + separate inset flap triangle (classic "folded page")</label>
</div>

<!-- V3: fold flap exaggerated into an arrow shape (concave notch making it chevron-like) -->
<div class="row">
<div class="cell big tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H36L50 22V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" fill-rule="evenodd" d="M36 8L50 22H40C37.8 22 36 20.2 36 18V8Z"/>
  <path fill="#1f1f1d" d="M50 22L40 22C38.9 22 38 21.1 38 20V14L50 22Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell mid tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H36L50 22V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" fill-rule="evenodd" d="M36 8L50 22H40C37.8 22 36 20.2 36 18V8Z"/>
  <path fill="#1f1f1d" d="M50 22L40 22C38.9 22 38 21.1 38 20V14L50 22Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell small tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H36L50 22V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" fill-rule="evenodd" d="M36 8L50 22H40C37.8 22 36 20.2 36 18V8Z"/>
  <path fill="#1f1f1d" d="M50 22L40 22C38.9 22 38 21.1 38 20V14L50 22Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<div class="cell tiny tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M14 11C14 9.3 15.3 8 17 8H36L50 22V53C50 54.7 48.7 56 47 56H17C15.3 56 14 54.7 14 53V11Z"/>
  <path fill="#fcfcfa" fill-rule="evenodd" d="M36 8L50 22H40C37.8 22 36 20.2 36 18V8Z"/>
  <path fill="#1f1f1d" d="M50 22L40 22C38.9 22 38 21.1 38 20V14L50 22Z"/>
  <rect x="21" y="38" width="22" height="5" rx="2.5" fill="#1f1f1d"/>
</svg></div>
<label>V3 — knockout fold + solid flap re-landed, bigger fold</label>
</div>

<!-- V4: smaller/subtler fold, line positioned higher, tighter page -->
<div class="row">
<div class="cell big tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M16 12C16 10.3 17.3 9 19 9H37L48 20V51C48 52.7 46.7 54 45 54H19C17.3 54 16 52.7 16 51V12Z"/>
  <path fill="#fcfcfa" d="M37 9L48 20H41C38.8 20 37 18.2 37 16V9Z"/>
  <rect x="23" y="30" width="18" height="4.5" rx="2.25" fill="#1f1f1d"/>
</svg></div>
<div class="cell mid tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M16 12C16 10.3 17.3 9 19 9H37L48 20V51C48 52.7 46.7 54 45 54H19C17.3 54 16 52.7 16 51V12Z"/>
  <path fill="#fcfcfa" d="M37 9L48 20H41C38.8 20 37 18.2 37 16V9Z"/>
  <rect x="23" y="30" width="18" height="4.5" rx="2.25" fill="#1f1f1d"/>
</svg></div>
<div class="cell small tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M16 12C16 10.3 17.3 9 19 9H37L48 20V51C48 52.7 46.7 54 45 54H19C17.3 54 16 52.7 16 51V12Z"/>
  <path fill="#fcfcfa" d="M37 9L48 20H41C38.8 20 37 18.2 37 16V9Z"/>
  <rect x="23" y="30" width="18" height="4.5" rx="2.25" fill="#1f1f1d"/>
</svg></div>
<div class="cell tiny tile"><svg viewBox="0 0 64 64">
  <path fill="#1f1f1d" d="M16 12C16 10.3 17.3 9 19 9H37L48 20V51C48 52.7 46.7 54 45 54H19C17.3 54 16 52.7 16 51V12Z"/>
  <path fill="#fcfcfa" d="M37 9L48 20H41C38.8 20 37 18.2 37 16V9Z"/>
  <rect x="23" y="30" width="18" height="4.5" rx="2.25" fill="#1f1f1d"/>

</div>

</body>
</html>
